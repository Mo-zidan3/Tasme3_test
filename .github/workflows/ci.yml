name: ci

# 1.4: docs-only pushes do not spend the private-repo Actions budget (2000 min/month);
# the instrumented job is additionally workflow_dispatch-re-runnable.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'download/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'download/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # §0 leak gate — runs FIRST on every trigger; a leak fails the whole pipeline.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan repo for credential-shaped strings
        run: |
          # real token SHAPES (long bodies) — not the short regex literals this scanner itself contains
          if git grep -nE '(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{36,}|gho_[A-Za-z0-9]{36,}|ghs_[A-Za-z0-9]{36,})' -- .; then
            echo "LEAK — STOP: credential-shaped string committed"; exit 1
          fi
          if grep -nE 'github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{36,}' .git/config; then
            echo "REMOTE LEAK — credential in git config"; exit 1
          fi
          echo "clean: no credential-shaped strings in tracked files or git config"
      - name: Notices placeholder check (no '…' in any notice)
        run: |
          bad=$(grep -rl '…' THIRD_PARTY_NOTICES.md app/src/main/assets/notices/ 2>/dev/null || true)
          if [ -n "$bad" ]; then echo "FAIL: ellipsis placeholder in notices: $bad"; exit 1; fi
          echo "clean: no placeholder ellipsis in notices"

  # Jobs are INDEPENDENT (no needs: chains) — release/size still produce evidence if the
  # emulator job fails. All artifact uploads use if: always() and 7-day retention.

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.1" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Cache native tarball + models + license texts (keyed by pinned SHA-256)
        uses: actions/cache@v4
        with:
          path: |
            third_party/sherpa-onnx-v2.0.2/sherpa-onnx-v2.0.2-android.tar.bz2
            app/src/main/jniLibs/
            app/src/debug/jniLibs/
            app/src/main/assets/models/
          key: native-models-v1-${{ runner.os }}-08d22f7eb5c49bd161d248633eeb66e84735725706e21202b684800e5081a029-88f9df290d57b8890275d79187b77515aeeb12626a42bc76cbd0f8bfcaff00f0
          restore-keys: native-models-v1-

      - name: Fetch native libs + notices + model assets (pinned SHA-256, backoff, hard-fail)
        run: |
          set -e
          for s in fetch_native generate_notices fetch_models; do
            ok=0
            for delay in 60 120 240 480; do
              if python3 scripts/$s.py; then ok=1; break; fi
              echo "$s failed; backoff ${delay}s"
              sleep $delay
            done
            [ "$ok" = 1 ] || { echo "FAIL: $s could not fetch pinned assets after 3 attempts — rate-limit? See docs/VERIFICATION V-006/V-012/V-027. Retry with re-run; do NOT skip."; exit 1; }
          done

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Unit tests + coverage (jacoco reports are HARD evidence for the gate)
        run: ./gradlew test :core:audio:testDebugUnitTest :core:asr:testDebugUnitTest :core:session:testDebugUnitTest :core:quran:test :core:align:test :core:quran:jacocoTestReport :core:align:jacocoTestReport

      # V-035 P2: coverage gate is REAL — parses the produced JaCoCo XML, prints the measured
      # numbers, fails below 85% line coverage on core:quran / core:align. No || true.
      - name: Coverage gate (core:quran + core:align ≥85% lines, from JaCoCo XML)
        run: python3 scripts/ci_coverage_gate.py 85

      # V-036 P2: ktlint 1.8.0 CLI pinned by sha256 — standalone runner, no plugin-classpath risk.
      # Gate semantics: (a) parse errors ("Not a valid Kotlin file") FAIL unconditionally;
      # (b) the committed ktlint-baseline.xml (V-036: ktlint's OWN baseline format, generated
      # once with --baseline and committed) holds the existing debt — any NEW violation is
      # outside the baseline and FAILS the run. Fixes shrink the baseline when regenerated.
      - name: Static analysis — ktlint (pinned CLI 1.8.0, sha-verified, committed baseline)
        run: |
          curl -fsSL -o ktlint "https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint"
          EXPECTED=a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75
          ACTUAL=$(sha256sum ktlint | cut -d' ' -f1)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "FAIL: ktlint sha mismatch ($ACTUAL)"; exit 1; }
          chmod +x ktlint
          ./ktlint --version
          ./ktlint 'core/**/*.kt' 'feature/**/*.kt' 'app/src/**/*.kt' \
            --baseline=ktlint-baseline.xml > ktlint-report.txt || true
          PARSE=$(grep -c "Not a valid Kotlin file" ktlint-report.txt || true)
          [ "$PARSE" = "0" ] || { echo "FAIL: $PARSE Kotlin file(s) failed to parse"; exit 1; }
          VIOL=$(grep -cE ':[0-9]+:[0-9]+: ' ktlint-report.txt || true)
          echo "ktlint violations OUTSIDE the committed baseline: $VIOL"
          [ "$VIOL" = "0" ] || { echo "FAIL: new ktlint violations — fix them, or regenerate ktlint-baseline.xml in the same commit"; exit 1; }

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      # §4/§12.1: merged manifest must contain NO INTERNET / ACCESS_NETWORK_STATE.
      - name: Merged-manifest offline check
        run: |
          M="app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml"
          echo "checking $M"
          if grep -Pzo '<uses-permission[^>]*android:name="android.permission.INTERNET"' "$M"; then
            echo "FAIL: INTERNET permission present in merged manifest"; exit 1
          fi
          if grep -Pzo '<uses-permission[^>]*android:name="android.permission.ACCESS_NETWORK_STATE"' "$M"; then
            echo "FAIL: ACCESS_NETWORK_STATE permission present in merged manifest"; exit 1
          fi
          echo "OK: merged manifest has no network permissions"

      # Classpath hygiene: :app releaseRuntimeClasspath must NOT contain tools:eval, JUnit, Truth.
      - name: Classpath hygiene check
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > deps-release.txt
          if grep -E "tools:eval|project :tools:eval|junit|truth" deps-release.txt; then
            echo "FAIL: test-only or harness modules leaked into :app releaseRuntimeClasspath"; exit 1
          fi
          echo "OK: releaseRuntimeClasspath clean"

      - name: Dependency license report
        run: ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > build-deps-report.txt

      # D-012/D-013: minSdk >= max(.note.android.ident api_level) over every shipped .so.
      - name: ABI floor assertion (debug APK)
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          python3 scripts/check_abi_floor.py 27 "$APK"

      - name: Debug APK ABI contents evidence (arm64 + x86_64 present)
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          unzip -l "$APK" | grep 'lib/' | tee debug-abi.txt
          grep -q 'lib/arm64-v8a/' debug-abi.txt || { echo "FAIL: debug APK missing arm64"; exit 1; }
          grep -q 'lib/x86_64/' debug-abi.txt || { echo "FAIL: debug APK missing x86_64 (emulator)"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          retention-days: 7
          path: |
            **/build/reports/**
            build-deps-report.txt
            debug-abi.txt

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.1" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Cache native tarball + models + license texts (keyed by pinned SHA-256)
        uses: actions/cache@v4
        with:
          path: |
            third_party/sherpa-onnx-v2.0.2/sherpa-onnx-v2.0.2-android.tar.bz2
            app/src/main/jniLibs/
            app/src/debug/jniLibs/
            app/src/main/assets/models/
          key: native-models-v1-${{ runner.os }}-08d22f7eb5c49bd161d248633eeb66e84735725706e21202b684800e5081a029-88f9df290d57b8890275d79187b77515aeeb12626a42bc76cbd0f8bfcaff00f0
          restore-keys: native-models-v1-

      - name: Fetch native libs + notices + model assets (pinned SHA-256, backoff, hard-fail)
        run: |
          set -e
          for s in fetch_native generate_notices fetch_models; do
            ok=0
            for delay in 60 120 240 480; do
              if python3 scripts/$s.py; then ok=1; break; fi
              echo "$s failed; backoff ${delay}s"
              sleep $delay
            done
            [ "$ok" = 1 ] || { echo "FAIL: $s could not fetch pinned assets after 3 attempts"; exit 1; }
          done

      # V-036 §3: LICENSE-BYTES GATE — every generated notice must be byte-identical to its
      # pinned canonical SHA-256. The run-45035800627 release shipped DEGRADED notices
      # (Tanzil 1004 B vs canonical 1106 B; OFL cb4bf64b… vs 72de68e5…) and secrets-scan
      # passed them because it only greps for '…'. Ellipsis-grep is NOT a license gate.
      - name: Notices canonical-SHA gate (license bytes, not ellipsis)
        run: python3 scripts/check_notices_sha.py

      - name: Build release APK + AAB (R8 ON)
        run: ./gradlew assembleRelease bundleRelease

      # T1 guard: release must be minified; sandboxNoMinify must never leak into CI.
      - name: Release minify guard
        run: |
          if [ ! -f app/build/outputs/mapping/release/mapping.txt ]; then
            echo "FAIL: no R8 mapping.txt found — release was NOT minified"; exit 1
          fi
          if grep -q "sandboxNoMinify" gradle.properties; then
            echo "FAIL: sandboxNoMinify property committed in gradle.properties"; exit 1
          fi
          echo "OK: release minified (mapping.txt present)"

      # D-003/D-013: release ships arm64-v8a ONLY.
      - name: Release ABI guard (arm64-v8a only)
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          unzip -l "$APK" | grep 'lib/' | tee release-abi.txt
          N=$(grep -c 'lib/' release-abi.txt)
          ARM=$(grep -c 'lib/arm64-v8a/' release-abi.txt)
          if [ "$N" != "$ARM" ] || [ "$ARM" -eq 0 ]; then
            echo "FAIL: release APK must contain arm64-v8a libs only"; exit 1
          fi
          python3 scripts/check_abi_floor.py 27 "$APK"

      # V-035 P0: bundletool measurement lives HERE (was a separate `size` job racing the
      # release-outputs artifact). Pinned jar + sha verification + in-job debug keystore
      # (never committed). ≤80 MB target warn, >85 MB hard fail. Prints to the step summary.
      - name: Measure AAB download size (bundletool 1.17.0, dimensions SDK/ABI/SCREEN_DENSITY)
        run: |
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          test -n "$AAB" || { echo "FAIL: no AAB produced"; exit 1; }
          curl -fsSL -o bundletool.jar "https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar"
          EXPECTED=54ebee1f1de8367d9ad26b4672bfb2976b0b12142e15d683fc7b8e254fc6cc1b
          ACTUAL=$(sha256sum bundletool.jar | cut -d' ' -f1)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "FAIL: bundletool sha mismatch ($ACTUAL)"; exit 1; }
          java -jar bundletool.jar version
          keytool -genkeypair -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          java -jar bundletool.jar build-apks --bundle="$AAB" --output=app.apks \
            --ks=debug.keystore --ks-pass=pass:android --ks-key-alias=androiddebugkey \
            --key-pass=pass:android --mode=universal
          java -jar bundletool.jar get-size total --apks=app.apks --dimensions=SDK,ABI,SCREEN_DENSITY > size-report.txt || \
            java -jar bundletool.jar get-size total --apks=app.apks > size-report.txt
          cat size-report.txt
          echo "### AAB download size (bundletool 1.17.0, universal apks)" >> $GITHUB_STEP_SUMMARY
          cat size-report.txt >> $GITHUB_STEP_SUMMARY
          # §14 budget: ≤80 MB target, 85 MB hard ceiling. V-036: robust CSV parse — plain
          # `get-size` prints "MIN,MAX" + rows; --dimensions prints SDK,ABI,...,MIN,MAX.
          # The old regex grabbed the bare comma between header fields → int('') crash.
          python3 - <<'PY'
          import csv, io, subprocess
          out = subprocess.run(["java","-jar","bundletool.jar","get-size","total","--apks=app.apks"],
                               capture_output=True, text=True).stdout
          rows = list(csv.reader(io.StringIO(out)))
          mins = []
          for row in rows:
              if len(row) >= 2 and row[-1].strip().isdigit() and row[-2].strip().isdigit():
                  mins.append(int(row[-2]))
          if not mins:
              print("could not parse size from:", out[:200]); raise SystemExit(1)
          mb = min(mins) / 1e6
          mx = max(int(r[-1]) for r in rows if len(r) >= 2 and r[-1].strip().isdigit()) / 1e6
          print(f"measured total download size: MIN {mb:.1f} MB / MAX {mx:.1f} MB (universal set: min=max)")
          print(f"budget: target 80.0 MB, hard ceiling 85.0 MB")
          if mx > 85:
              print("FAIL: above 85 MB hard ceiling"); raise SystemExit(1)
          elif mb > 80:
              print("WARN: above the 80 MB target — escalate to Mo (PAD / drop tiny / accept with ADR)")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-outputs
          retention-days: 7
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            release-abi.txt
            size-report.txt

  instrumented:
    # V-035 P1: ubuntu-latest migrated to ubuntu-26.04 without /dev/kvm — the emulator
    # refused `-accel off` ("Software CPU emulation is not supported... A hardware CPU
    # accelerator is required") and boot timed out. KVM is REQUIRED; slow TCG is NOT an
    # accepted fallback (would need Mo's explicit sign-off for very long runs). Hosted
    # ubuntu-24.04 runners still expose /dev/kvm to the runner user.
    # T3a: emulator jobs run ONLY on push-to-main + workflow_dispatch — PRs get
    # build + release + secrets-scan (emulator minutes on PRs waste the budget; the
    # merge itself re-runs the full matrix).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # API 27 = the REAL native floor (V-016/D-012); API 35 = modern shipping profile.
        api-level: [27, 35]
    steps:
      - uses: actions/checkout@v4

      # V-035 P1: hard pre-flight — fail FAST and EXPLICITLY if the runner has no KVM,
      # before minutes of SDK setup + model fetches are spent on a doomed boot.
      - name: Pre-flight — hardware acceleration (/dev/kvm) is mandatory
        run: |
          test -e /dev/kvm || { echo "FAIL: no /dev/kvm on this runner — emulator needs hardware acceleration; refusing slow TCG (V-035). Escalate: macOS arm64 runner or Mo's physical device."; exit 1; }
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.1" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Cache native tarball + models + license texts (keyed by pinned SHA-256)
        uses: actions/cache@v4
        with:
          path: |
            third_party/sherpa-onnx-v2.0.2/sherpa-onnx-v2.0.2-android.tar.bz2
            app/src/main/jniLibs/
            app/src/debug/jniLibs/
            app/src/main/assets/models/
          key: native-models-v1-${{ runner.os }}-08d22f7eb5c49bd161d248633eeb66e84735725706e21202b684800e5081a029-88f9df290d57b8890275d79187b77515aeeb12626a42bc76cbd0f8bfcaff00f0
          restore-keys: native-models-v1-

      - name: Fetch native libs + notices + model assets (pinned SHA-256, backoff, hard-fail)
        run: |
          set -e
          for s in fetch_native generate_notices fetch_models; do
            ok=0
            for delay in 60 120 240 480; do
              if python3 scripts/$s.py; then ok=1; break; fi
              echo "$s failed; backoff ${delay}s"
              sleep $delay
            done
            [ "$ok" = 1 ] || { echo "FAIL: $s could not fetch pinned assets after 3 attempts"; exit 1; }
          done

      # 1.3: the permanent CI decode fixture — deterministic, code-generated, zero licensing risk.
      # V-037c: ALSO generated into the androidTest APK's ASSETS — scoped storage on API 35
      # hides shell-pushed external files from the app under File probes (probed-path evidence,
      # run 45066011428); APK assets are the only channel guaranteed visible on all APIs.
      - name: Generate deterministic timing fixture
        run: |
          python3 scripts/make_timing_fixture.py eval/fixtures/timing_fixture.wav
          mkdir -p app/src/androidTest/assets/eval/fixtures
          python3 scripts/make_timing_fixture.py app/src/androidTest/assets/eval/fixtures/timing_fixture.wav

      - name: Run instrumented tests on emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          # V-035 P1: hw accel ON explicitly (the action's default sets -accel off when it
          # can't detect KVM — the 26.04 failure); -no-metrics removes the metrics warning.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            adb shell settings put global window_animation_scale 0
            ./gradlew :app:connectedDebugAndroidTest || { echo "instrumented run failed"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-api${{ matrix.api-level }}
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
