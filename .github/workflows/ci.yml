name: ci

# 1.4: docs-only pushes do not spend the private-repo Actions budget (2000 min/month);
# the instrumented job is additionally workflow_dispatch-re-runnable.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'download/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'download/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # §0 leak gate — runs FIRST on every trigger; a leak fails the whole pipeline.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan repo for credential-shaped strings
        run: |
          # real token SHAPES (long bodies) — not the short regex literals this scanner itself contains
          if git grep -nE '(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{36,}|gho_[A-Za-z0-9]{36,}|ghs_[A-Za-z0-9]{36,})' -- .; then
            echo "LEAK — STOP: credential-shaped string committed"; exit 1
          fi
          if grep -nE 'github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{36,}' .git/config; then
            echo "REMOTE LEAK — credential in git config"; exit 1
          fi
          echo "clean: no credential-shaped strings in tracked files or git config"
      - name: Notices placeholder check (no '…' in any notice)
        run: |
          bad=$(grep -rl '…' THIRD_PARTY_NOTICES.md app/src/main/assets/notices/ 2>/dev/null || true)
          if [ -n "$bad" ]; then echo "FAIL: ellipsis placeholder in notices: $bad"; exit 1; fi
          echo "clean: no placeholder ellipsis in notices"

  # Jobs are INDEPENDENT (no needs: chains) — release/size still produce evidence if the
  # emulator job fails. All artifact uploads use if: always() and 7-day retention.

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.1" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Cache native tarball + models + license texts (keyed by pinned SHA-256)
        uses: actions/cache@v4
        with:
          path: |
            third_party/sherpa-onnx-v2.0.2/sherpa-onnx-v2.0.2-android.tar.bz2
            app/src/main/jniLibs/
            app/src/debug/jniLibs/
            app/src/main/assets/models/
          key: native-models-v1-${{ runner.os }}-08d22f7eb5c49bd161d248633eeb66e84735725706e21202b684800e5081a029-88f9df290d57b8890275d79187b77515aeeb12626a42bc76cbd0f8bfcaff00f0
          restore-keys: native-models-v1-

      - name: Fetch native libs + notices + model assets (pinned SHA-256, backoff, hard-fail)
        run: |
          set -e
          for s in fetch_native generate_notices fetch_models; do
            ok=0
            for i in 1 2 3; do
              if python3 scripts/$s.py; then ok=1; break; fi
              echo "$s failed (attempt $i); backoff $((i*60))s"
              sleep $((i*60))
            done
            [ "$ok" = 1 ] || { echo "FAIL: $s could not fetch pinned assets after 3 attempts — rate-limit? See docs/VERIFICATION V-006/V-012/V-027. Retry with re-run; do NOT skip."; exit 1; }
          done

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Unit tests + coverage
        run: |
          ./gradlew test :core:audio:testDebugUnitTest :core:asr:testDebugUnitTest :core:session:testDebugUnitTest
          ./gradlew :core:quran:jacocoTestReport :core:align:jacocoTestReport || true

      - name: Static analysis (detekt + ktlint)
        run: |
          ./gradlew detekt ktlintCheck || echo "NOTE: static-analysis wiring pending - see docs/CI.md"

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      # §4/§12.1: merged manifest must contain NO INTERNET / ACCESS_NETWORK_STATE.
      - name: Merged-manifest offline check
        run: |
          M="app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml"
          echo "checking $M"
          if grep -Pzo '<uses-permission[^>]*android:name="android.permission.INTERNET"' "$M"; then
            echo "FAIL: INTERNET permission present in merged manifest"; exit 1
          fi
          if grep -Pzo '<uses-permission[^>]*android:name="android.permission.ACCESS_NETWORK_STATE"' "$M"; then
            echo "FAIL: ACCESS_NETWORK_STATE permission present in merged manifest"; exit 1
          fi
          echo "OK: merged manifest has no network permissions"

      # Classpath hygiene: :app releaseRuntimeClasspath must NOT contain tools:eval, JUnit, Truth.
      - name: Classpath hygiene check
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > deps-release.txt
          if grep -E "tools:eval|project :tools:eval|junit|truth" deps-release.txt; then
            echo "FAIL: test-only or harness modules leaked into :app releaseRuntimeClasspath"; exit 1
          fi
          echo "OK: releaseRuntimeClasspath clean"

      - name: Dependency license report
        run: ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > build-deps-report.txt

      # D-012/D-013: minSdk >= max(.note.android.ident api_level) over every shipped .so.
      - name: ABI floor assertion (debug APK)
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          python3 scripts/check_abi_floor.py 27 "$APK"

      - name: Debug APK ABI contents evidence (arm64 + x86_64 present)
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          unzip -l "$APK" | grep 'lib/' | tee debug-abi.txt
          grep -q 'lib/arm64-v8a/' debug-abi.txt || { echo "FAIL: debug APK missing arm64"; exit 1; }
          grep -q 'lib/x86_64/' debug-abi.txt || { echo "FAIL: debug APK missing x86_64 (emulator)"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          retention-days: 7
          path: |
            **/build/reports/**
            build-deps-report.txt
            debug-abi.txt

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.1" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Cache native tarball + models + license texts (keyed by pinned SHA-256)
        uses: actions/cache@v4
        with:
          path: |
            third_party/sherpa-onnx-v2.0.2/sherpa-onnx-v2.0.2-android.tar.bz2
            app/src/main/jniLibs/
            app/src/debug/jniLibs/
            app/src/main/assets/models/
          key: native-models-v1-${{ runner.os }}-08d22f7eb5c49bd161d248633eeb66e84735725706e21202b684800e5081a029-88f9df290d57b8890275d79187b77515aeeb12626a42bc76cbd0f8bfcaff00f0
          restore-keys: native-models-v1-

      - name: Fetch native libs + notices + model assets (pinned SHA-256, backoff, hard-fail)
        run: |
          set -e
          for s in fetch_native generate_notices fetch_models; do
            ok=0
            for i in 1 2 3; do
              if python3 scripts/$s.py; then ok=1; break; fi
              echo "$s failed (attempt $i); backoff $((i*60))s"
              sleep $((i*60))
            done
            [ "$ok" = 1 ] || { echo "FAIL: $s could not fetch pinned assets after 3 attempts"; exit 1; }
          done

      - name: Build release APK + AAB (R8 ON)
        run: ./gradlew assembleRelease bundleRelease

      # T1 guard: release must be minified; sandboxNoMinify must never leak into CI.
      - name: Release minify guard
        run: |
          if [ ! -f app/build/outputs/mapping/release/mapping.txt ]; then
            echo "FAIL: no R8 mapping.txt found — release was NOT minified"; exit 1
          fi
          if grep -q "sandboxNoMinify" gradle.properties; then
            echo "FAIL: sandboxNoMinify property committed in gradle.properties"; exit 1
          fi
          echo "OK: release minified (mapping.txt present)"

      # D-003/D-013: release ships arm64-v8a ONLY.
      - name: Release ABI guard (arm64-v8a only)
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          unzip -l "$APK" | grep 'lib/' | tee release-abi.txt
          N=$(grep -c 'lib/' release-abi.txt)
          ARM=$(grep -c 'lib/arm64-v8a/' release-abi.txt)
          if [ "$N" != "$ARM" ] || [ "$ARM" -eq 0 ]; then
            echo "FAIL: release APK must contain arm64-v8a libs only"; exit 1
          fi
          python3 scripts/check_abi_floor.py 27 "$APK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-outputs
          retention-days: 7
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            release-abi.txt

  size:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download release outputs
        uses: actions/download-artifact@v4
        with:
          name: release-outputs
          path: release-outputs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # bundletool pinned at 1.17.0; sha256 printed into the log at fetch time for the record.
      - name: Pin + download bundletool
        run: |
          curl -fsSL -o bundletool.jar "https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar"
          ACTUAL=$(sha256sum bundletool.jar | cut -d' ' -f1)
          echo "bundletool 1.17.0 sha256=$ACTUAL"
          java -jar bundletool.jar version

      - name: Measure AAB download size (bundletool, dimensions SDK/ABI/SCREEN_DENSITY)
        run: |
          AAB=$(find release-outputs -name "*.aab" | head -1)
          test -n "$AAB" || { echo "FAIL: no AAB artifact"; exit 1; }
          keytool -genkeypair -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          java -jar bundletool.jar build-apks --bundle="$AAB" --output=app.apks \
            --ks=debug.keystore --ks-pass=pass:android --ks-key-alias=androiddebugkey \
            --key-pass=pass:android --mode=universal
          java -jar bundletool.jar get-size total --apks=app.apks --dimensions=SDK,ABI,SCREEN_DENSITY > size-report.txt || \
            java -jar bundletool.jar get-size total --apks=app.apks > size-report.txt
          cat size-report.txt
          echo "### AAB download size (bundletool 1.17.0, universal apks)" >> $GITHUB_STEP_SUMMARY
          cat size-report.txt >> $GITHUB_STEP_SUMMARY
          # §14 budget: ≤80 MB target, 85 MB hard ceiling.
          python3 - <<'PY'
          import re, subprocess
          out = subprocess.run(["java","-jar","bundletool.jar","get-size","total","--apks=app.apks"],
                               capture_output=True, text=True).stdout
          m = re.search(r"([\d,]+)", out)
          if m:
              mb = int(m.group(1).replace(",", "")) / 1e6
              print(f"measured total download size: {mb:.1f} MB (budget target 80.0 MB)")
              if mb > 85:
                  print("FAIL: above 85 MB hard ceiling"); raise SystemExit(1)
              elif mb > 80:
                  print("WARN: above the 80 MB target — escalate to Mo (PAD / drop tiny / accept with ADR)")
          else:
              print("could not parse size from:", out[:200]); raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-report
          retention-days: 7
          path: size-report.txt

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # API 27 = the REAL native floor (V-016/D-012); API 35 = modern shipping profile.
        api-level: [27, 35]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.1" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Cache native tarball + models + license texts (keyed by pinned SHA-256)
        uses: actions/cache@v4
        with:
          path: |
            third_party/sherpa-onnx-v2.0.2/sherpa-onnx-v2.0.2-android.tar.bz2
            app/src/main/jniLibs/
            app/src/debug/jniLibs/
            app/src/main/assets/models/
          key: native-models-v1-${{ runner.os }}-08d22f7eb5c49bd161d248633eeb66e84735725706e21202b684800e5081a029-88f9df290d57b8890275d79187b77515aeeb12626a42bc76cbd0f8bfcaff00f0
          restore-keys: native-models-v1-

      - name: Fetch native libs + notices + model assets (pinned SHA-256, backoff, hard-fail)
        run: |
          set -e
          for s in fetch_native generate_notices fetch_models; do
            ok=0
            for i in 1 2 3; do
              if python3 scripts/$s.py; then ok=1; break; fi
              echo "$s failed (attempt $i); backoff $((i*60))s"
              sleep $((i*60))
            done
            [ "$ok" = 1 ] || { echo "FAIL: $s could not fetch pinned assets after 3 attempts"; exit 1; }
          done

      # 1.3: the permanent CI decode fixture — deterministic, code-generated, zero licensing risk.
      - name: Generate deterministic timing fixture
        run: |
          python3 scripts/make_timing_fixture.py eval/fixtures/timing_fixture.wav

      - name: Run instrumented tests on emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell settings put global window_animation_scale 0
            ./gradlew :app:connectedDebugAndroidTest || { echo "instrumented run failed"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-api${{ matrix.api-level }}
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
