# JVM: 2 cores / 4 GB sandbox — keep heap conservative but enough for KSP+Compose
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache disabled: AGP+KSP combination in this sandbox showed stale-entry
# issues across rebuilds; correctness over speed for Phase 0.
org.gradle.configuration-cache=false

# AGP 9 defaults (recorded in docs/DECISIONS.md)
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin stdlib is added by AGP built-in Kotlin automatically
kotlin.stdlib.default.dependency=true

# Sandbox SDK path is committed via local.properties (not committed to VCS)
